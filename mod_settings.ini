[Mod]
Id = DangerousVampiricUrges
Name = Dangerous Vampiric Urges
Author = GoldNiala
Version = 0.7
Description = Change how [Give in to the hunger] dialogue option is presented on screen. For example you can set it, to replace random dialogue option (similiar to prologue). Currently displaying is based on hunger lvl. Set custom HP thresholds for hunger level.
;------------------------------------------------------------
; DIALOGUE
;------------------------------------------------------------
[Setting.ChangingDialogue]
Id = ChangingDialogue
Type = toggle
Label = Changing dialogue (RELOAD/RESTART WHEN ON->OFF)
Description = Change from from on->off takes effect after reloading/restarting the game (should work in main menu).
Group = Dialogue
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = ChangingDialogue

[Setting.lowHungerDialogueReplace]
Id = lowHungerDialogueReplace
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Replacement Mode
Description =  Vanilla: no replacament, Previous: [Give in to the hunger] will periodically replace previous option, Random: [Give in to the hunger] will replace random dialogue option. Applied when Coen has low hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue
Group = Low Hunger
PresetValues = 0|1|2
PresetLabels = Vanilla|Previous|Random
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = lowHungerDialogueReplace

[Setting.lowHungerDialogueIntensity]
Id = lowHungerDialogueIntensity
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Intensity
Description = Low: basically no shaking and white color, High: shaking and red color. Applied when Coen has low hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue. 
Group = Low Hunger
PresetValues = 0|1|2
PresetLabels = Low|Medium|High
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = lowHungerDialogueIntensity

[Setting.mediumHungerDialogueReplace]
Id = mediumHungerDialogueReplace
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Replacement Mode
Description = Vanilla: no replacament, Previous: [Give in to the hunger] will periodically replace previous option, Random: [Give in to the hunger] will replace random dialogue option. Applied when Coen has Medium hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue
Group = Medium Hunger
PresetValues = 0|1|2
PresetLabels = Vanilla|Previous|Random
Default = 2
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = mediumHungerDialogueReplace

[Setting.mediumHungerDialogueIntensity]
Id = mediumHungerDialogueIntensity
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Intensity
Description = Low: basically no shaking and white color, High: shaking and red color. Applied when Coen has Medium hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue
Group = Medium Hunger
PresetValues = 0|1|2
PresetLabels = Low|Medium|High
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = mediumHungerDialogueIntensity

[Setting.highHungerDialogueReplace]
Id = highHungerDialogueReplace
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Replacement Mode
Description = Vanilla: no replacament, Previous: [Give in to the hunger] will periodically replace previous option, Random: [Give in to the hunger] will replace random dialogue option. Applied when Coen has High hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue
Group = High Hunger
PresetValues = 0|1|2
PresetLabels = Vanilla|Previous|Random
Default = 2
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = highHungerDialogueReplace

[Setting.highHungerDialogueIntensity]
Id = highHungerDialogueIntensity
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = picker
Label = Intensity
Description = Low: basically no shaking and white color, High: shaking and red color. Applied when Coen has High hunger. Changes are applied outside of dialogue. If setting changed during dialogue, it won's work until new [Give in to the hunger] show, or exititng current dialogue
Group = High Hunger
PresetValues = 0|1|2
PresetLabels = Low|Medium|High
Default = 2
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = highHungerDialogueIntensity

[Setting.disableForcefullFeed]
Id = disableForcefullFeed
VisibleWhen = ChangingDialogue
VisibleValues = 1
Type = toggle
Label = Forcefull feeding in dialogue
Description = Disabled: Coen no longer automaticly kills npc during dialogue when on high hunger. Doesn't affect [Give in to the hunger], you can still choose this option, and it will work like vanilla. Changes are applied outside of dialogue.  If setting changed during dialogue, it won's work until new [Give in to the hunger] shows, or after exititing current dialogue
Group = High Hunger
PresetValues = 0|1
PresetLabels = Vanilla|Disable
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = disableForcefullFeed
;------------------------------------------------------------
; HUNGER HP
;------------------------------------------------------------
[Setting.CustomHungerHPThreshold]
Id = CustomHungerHPThreshold
Type = toggle
Label = Custom Hunger - HP % Threshold
Description = Option description
Group = Custom Hunger
PresetValues = 0|1
PresetLabels = Off|On
Default = 0
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = CustomHungerHPThreshold

[Setting.oneThreshold]
Id = oneThreshold
VisibleWhen = CustomHungerHPThreshold
VisibleValues = 1
Type = toggle
Label = Use One Threshold For Every HP Segment Amount
Description = Off: always use the same percent thresholds and ignore number of hp segments, WILL USE THRESHOLDS FOR 2 SEGMENTS; On use different thresholds, based on current number of hp segments
Group = Custom Hunger Threshold Based On HP
PresetValues = 0|1
PresetLabels = Off|On
Default = 1
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = oneThreshold

[Setting.twoSegLow]
Id = twoSegLow
VisibleWhen = CustomHungerHPThreshold
VisibleValues = 1
Type = integer
Label = Low%
Description = LOW hunger if hp is from Low% - 100% (Low % included), MEDIUM hunger if hp is from High% - Low% (40% included), HIGH hunger if hp is from 0% - High%
Group = Default (2 segments HP)
Minimum = 1
Maximum = 100
Step = 1
Decimals = 0
Default = 80
Suffix = %
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = twoSegLow

[Setting.twoSegHigh]
Id = twoSegHigh
VisibleWhen = CustomHungerHPThreshold
VisibleValues = 1
Type = integer
Label = High%
Description = LOW hunger if hp is from Low% - 100% (Low % included), MEDIUM hunger if hp is from High% - Low% (40% included), HIGH hunger if hp is from 0% - High%
Group = Default (2 segments HP)
Minimum = 1
Maximum = 100
Step = 1
Decimals = 0
Default = 40
Suffix = %
ConfigFile = config.ini
ConfigSection = Settings
ConfigKey = twoSegHigh

